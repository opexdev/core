server:
  port: 8080
spring:
  application:
    name: opex-price-management
  kafka:
    bootstrap-servers: ${KAFKA_IP_PORT:localhost:9092}
    consumer:
      group-id: price-management
  r2dbc:
    url: r2dbc:postgresql://${DB_IP_PORT:localhost}/opex
    username: ${dbusername:opex}
    password: ${dbpassword:hiopex}
    initialization-mode: always
    pool:
      initial-size: 5
      max-size: 32
      max-idle-time: 10m
      max-life-time: 30m
      max-acquire-time: 10s
      max-create-connection-time: 10s
      validation-query: SELECT 1
  datasource:
    url: jdbc:postgresql://${DB_IP_PORT:localhost}/opex
    username: ${dbusername:opex}
    password: ${dbpassword:hiopex}
  cloud:
    bootstrap:
      enabled: true
    vault:
      host: ${VAULT_HOST}
      port: 8200
      scheme: http
      authentication: APPID
      app-id:
        user-id: co.nilin.opex.price.app.utils.VaultUserIdMechanism
      fail-fast: true
      kv:
        enabled: true
        backend: secret
        profile-separator: '/'
        application-name: ${spring.application.name}
    consul:
      host: ${CONSUL_HOST:localhost}
      port: 8500
      discovery:
        #healthCheckPath: ${management.context-path}/health
        instance-id: ${spring.application.name}:${server.port}
        healthCheckInterval: 20s
        prefer-ip-address: true
  config:
    import: vault://secret/${spring.application.name}
  codec:
    max-in-memory-size: 20MB
management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: [ "health", "prometheus", "metrics" ]
  endpoint:
    health:
      show-details: when_authorized
    metrics:
      enabled: true
    prometheus:
      enabled: true
logbook:
  secure-filter:
    enabled: true
  format:
    style: http
  filter:
    enabled: true
    form-request-mode: BODY
  attribute-extractors:
    - type: JwtFirstMatchingClaimExtractor
      claim-names: [ "sub", "subject" ]
  obfuscate:
    headers:
      - Authorization
    parameters:
      - password
    json-body-fields:
      - password
    replacement: "***"
  write:
    max-body-size: 10_000 #kb
  predicate:
    exclude:
      - path: /auth**
      - path: /actuator/**
      - path: /swagger**
    include:
      - path: /test**
      - path: /admin/**
        methods:
          - POST
          - PUT
logging:
  level:
    org.apache.kafka: ERROR
    co.nilin: INFO
    org.zalando.logbook: TRACE

app:
  auth:
    cert-url: http://keycloak:8080/realms/opex/protocol/openid-connect/certs
  price-proxy:
    url: ${PRICE_PROXY_URL}
    api-key: ${PRICE_PROXY_API_KEY}
    secret-key: ${PRICE_PROXY_SECRET_KEY}
  wallet:
    url: http://opex-wallet
  bale:
    base-url: ${BALE_API_URL:https://tapi.bale.ai}
    bot-token: ${BALE_BOT_TOKEN:}
    chat-id: ${BALE_CHAT_ID:}
  price-management:
    update-interval: ${PRICE_UPDATE_INTERVAL:10000}
    max-price-age-seconds: ${MAX_PRICE_AGE_SECONDS:300}
    outlier-threshold-percent: ${PRICE_OUTLIER_THRESHOLD_PERCENT:5}
    stale-alert-age-seconds: ${PRICE_STALE_ALERT_AGE_SECONDS:120}
    freshness-check-interval: ${PRICE_FRESHNESS_CHECK_INTERVAL:60000}
  custom-message:
    enabled: ${CUSTOM_MESSAGE_ENABLED:false}
    base-url: ${CUSTOM_MESSAGE_URL}
  custom-user-language:
    enabled: ${CUSTOM_USER_LANGUAGE_ENABLED:false}