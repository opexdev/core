server:
  port: 8080
spring:
  application:
    name: opex-api
  main:
    allow-bean-definition-overriding: true
    allow-circular-references: true
  r2dbc:
    url: r2dbc:postgresql://${DB_IP_PORT:localhost}/opex
    username: ${dbusername:opex}
    password: ${dbpassword:hiopex}
#    initialization-mode: always
    pool:
      enabled: true
      initial-size: 5
      max-size: 20
      max-idle-time: 60s
      validation-query: SELECT 1
  datasource:
    url: jdbc:postgresql://${DB_IP_PORT:localhost}/opex
    username: ${dbusername:opex}
    password: ${dbpassword:hiopex}
  cache:
    type: redis
  cloud:
    bootstrap:
      enabled: true
    vault:
      host: ${VAULT_HOST}
      port: 8200
      scheme: http
      authentication: APPID
      app-id:
        user-id: co.nilin.opex.api.app.utils.VaultUserIdMechanism
      fail-fast: true
      kv:
        enabled: true
        backend: secret
        profile-separator: '/'
        application-name: ${spring.application.name}
    consul:
      host: ${CONSUL_HOST:localhost}
      port: 8500
      discovery:
        #healthCheckPath: ${management.context-path}/health
        instance-id: ${spring.application.name}:${server.port}
        healthCheckInterval: 20s
        prefer-ip-address: true
  config:
    import: vault://secret/${spring.application.name}
  data:
    redis:
      port: 6379
      host: redis-cache
management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: [ "health", "prometheus", "metrics", "loggers" ]
  endpoint:
    health:
      show-details: when_authorized
    metrics:
      enabled: true
    prometheus:
      enabled: true
logbook:
  secure-filter:
    enabled: true
  format:
    style: http
  filter:
    enabled: true
    form-request-mode: BODY
  attribute-extractors:
    - type: JwtFirstMatchingClaimExtractor
      claim-names: [ "sub", "subject" ]
  obfuscate:
    headers:
      - Authorization
    parameters:
      - password
    json-body-fields:
      - password
    replacement: "***"
  write:
    max-body-size: 10_000 #kb
  predicate:
    exclude:
      - path: /auth**
      - path: /actuator/**
      - path: /swagger**
    include:
      - path: /v3/order
        methods:
          - POST
          - PUT
      - path: /v1/capital/deposit/address
      - path: /v1/api-key
        methods:
          - POST
          - PUT
          - DELETE
logging:
  level:
    co.nilin: INFO
    org.zalando.logbook: TRACE
    reactor.netty.pool: WARN
    reactor.netty.http.client: WARN
    org.springframework.web.reactive.function.client: WARN
    co.nilin.opex.api.ports.proxy.impl: INFO

app:
  base:
    url: ${APP_BASE_URL:api}
  accountant:
    url: http://opex-accountant
  profile:
    url: http://opex-profile
  matching-gateway:
    url: http://opex-matching-gateway
  wallet:
    url: http://opex-wallet
  market:
    url: http://opex-market
  opex-bc-gateway:
    url: http://opex-bc-gateway
  storage:
    url: http://storage
  config:
    url: http://opex-config
  auth-gateway:
    url: http://opex-auth-gateway
  auth:
    url: http://keycloak:8080
    cert-url: http://keycloak:8080/realms/opex/protocol/openid-connect/certs
    iss-url: ${TOKEN_ISSUER_URL:http://keycloak:8080/realms/opex}
    token-url: http://keycloak:8080/realms/opex/protocol/openid-connect/token
    api-key-client:
      secret: ${API_KEY_CLIENT_SECRET}
      id: opex-api-key
  binance:
    api-url: https://api1.binance.com
  user-activity-reference-currency: ${USER_ACTIVITY_REFERENCE_CURRENCY:USDT}
  custom-message:
    enabled: ${CUSTOM_MESSAGE_ENABLED:false}
    base-url: ${CUSTOM_MESSAGE_URL}
  custom-user-language:
    enabled: ${CUSTOM_USER_LANGUAGE_ENABLED:false}
  api:
    crypto:
      key: ${api_crypto_key:0e1fd29572ec8c85970d76e3433e96ee}
  http:
    client:
      wiretap:
        enabled: ${HTTP_CLIENT_WIRETAP_ENABLED:false}
      general:
        max-connections: ${HTTP_CLIENT_GENERAL_MAX_CONNECTIONS:300}
        pending-acquire-max-count: ${HTTP_CLIENT_GENERAL_PENDING_ACQUIRE_MAX_COUNT:1000}
        max-idle-seconds: ${HTTP_CLIENT_GENERAL_MAX_IDLE_SECONDS:30}
        max-life-seconds: ${HTTP_CLIENT_GENERAL_MAX_LIFE_SECONDS:120}
        pending-acquire-timeout-seconds: ${HTTP_CLIENT_GENERAL_PENDING_ACQUIRE_TIMEOUT_SECONDS:30}
        connect-timeout-millis: ${HTTP_CLIENT_GENERAL_CONNECT_TIMEOUT_MILLIS:5000}
        response-timeout-seconds: ${HTTP_CLIENT_GENERAL_RESPONSE_TIMEOUT_SECONDS:30}
      keycloak:
        max-connections: ${HTTP_CLIENT_KEYCLOAK_MAX_CONNECTIONS:150}
        pending-acquire-max-count: ${HTTP_CLIENT_KEYCLOAK_PENDING_ACQUIRE_MAX_COUNT:500}
        max-idle-seconds: ${HTTP_CLIENT_KEYCLOAK_MAX_IDLE_SECONDS:30}
        max-life-seconds: ${HTTP_CLIENT_KEYCLOAK_MAX_LIFE_SECONDS:120}
        pending-acquire-timeout-seconds: ${HTTP_CLIENT_KEYCLOAK_PENDING_ACQUIRE_TIMEOUT_SECONDS:60}
        connect-timeout-millis: ${HTTP_CLIENT_KEYCLOAK_CONNECT_TIMEOUT_MILLIS:10000}
        response-timeout-seconds: ${HTTP_CLIENT_KEYCLOAK_RESPONSE_TIMEOUT_SECONDS:10}
  proxy:
    market:
      max-concurrent-requests: ${API_PROXY_MARKET_MAX_CONCURRENT_REQUESTS:64}
    matching:
      max-concurrent-requests: ${API_PROXY_MATCHING_MAX_CONCURRENT_REQUESTS:64}
  cors:
    enabled: true
    allowed-origins: ${ALLOWED_ORIGINS:"http://localhost:8110"}
  openapi:
    server-url: ${OPEN_API_SERVER_URL}
# --- Swagger / SpringDoc (env-driven) ---
springdoc:
  api-docs:
    enabled: ${SWAGGER_API_DOCS_ENABLED:false}
    path: ${SWAGGER_API_DOCS_PATH:/v3/api-docs}
  swagger-ui:
    enabled: ${SWAGGER_UI_ENABLED:false}
    path: ${SWAGGER_UI_PATH:/swagger-ui.html}
    try-it-out-enabled: ${SWAGGER_TRY_IT_OUT_ENABLED:true}
    persist-authorization: ${SWAGGER_PERSIST_AUTHORIZATION:true}
    display-request-duration: true
    operations-sorter: method
    tags-sorter: alpha
