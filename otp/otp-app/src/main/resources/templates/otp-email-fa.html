<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>کد تایید شما</title>
</head>

<body style="margin:0; padding:0; background-color:#f5f7fa; font-family:Tahoma,Arial,sans-serif; color:#1f2937;">
<table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f5f7fa; padding:40px 16px;">
    <tr>
        <td align="center">

            <table width="100%" cellpadding="0" cellspacing="0" border="0" dir="rtl"
                   style="max-width:520px; background:#ffffff; border-radius:12px;">

                <!-- Header -->
                <tr>
                    <td style="padding:32px 32px 20px; text-align:center;">
                        <div style="font-size:24px; font-weight:bold; color:#111827;">
                            {{APP_NAME}}
                        </div>
                    </td>
                </tr>

                <!-- Content -->
                <tr>
                    <td style="padding:0 32px 32px; text-align:right;">

                        <h1 style="margin:0 0 16px; font-size:22px; line-height:30px; color:#111827;">
                            تایید ایمیل شما
                        </h1>

                        <p style="margin:0 0 24px; font-size:15px; line-height:24px; color:#4b5563;">
                            برای ادامه ورود به حساب {{APP_NAME}} خود، از کد تایید زیر استفاده کنید.
                        </p>

                        <!-- OTP -->
                        <div style="text-align:center; margin:28px 0;">
                            <div style="
                                display:inline-block;
                                padding:16px 28px;
                                background:#f3f4f6;
                                border-radius:8px;
                                font-size:30px;
                                font-weight:bold;
                                letter-spacing:8px;
                                color:#111827;
                                direction:ltr;
                            ">
                                {{OTP}}
                            </div>
                        </div>

                        <p style="margin:0 0 8px; font-size:14px; line-height:22px; color:#6b7280;">
                            این کد تا <strong>۲ دقیقه</strong> دیگر منقضی می‌شود.
                        </p>

                        <p style="margin:20px 0 0; font-size:14px; line-height:22px; color:#6b7280;">
                            اگر این کد را درخواست نکرده‌اید، می‌توانید این ایمیل را نادیده بگیرید.
                        </p>

                    </td>
                </tr>

                <!-- Footer -->
                <tr>
                    <td style="
                        padding:20px 32px 28px;
                        border-top:1px solid #e5e7eb;
                        text-align:center;
                    ">
                        <p style="margin:0; font-size:12px; line-height:18px; color:#9ca3af;">
                            این یک پیام خودکار است. لطفاً به این ایمیل پاسخ ندهید.
                        </p>

                        <p style="margin:8px 0 0; font-size:12px; color:#9ca3af;">
                            © {{APP_NAME}}
                        </p>
                    </td>
                </tr>

            </table>

        </td>
    </tr>
</table>
</body>
</html>
