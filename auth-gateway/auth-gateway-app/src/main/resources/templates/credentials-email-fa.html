<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اطلاعات ورود شما</title>
</head>

<body style="margin:0; padding:0; background-color:#f5f7fa; font-family:Tahoma,Arial,sans-serif; color:#1f2937;">
<table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f5f7fa; padding:40px 16px;">
    <tr>
        <td align="center">

            <table width="100%" cellpadding="0" cellspacing="0" border="0" dir="rtl"
                   style="max-width:520px; background:#ffffff; border-radius:12px;">

                <tr>
                    <td style="padding:32px 32px 20px; text-align:center;">
                        <div style="font-size:24px; font-weight:bold; color:#111827;">
                            {{APP_NAME}}
                        </div>
                    </td>
                </tr>

                <tr>
                    <td style="padding:0 32px 32px; text-align:right;">

                        <h1 style="margin:0 0 16px; font-size:22px; line-height:30px; color:#111827;">
                            حساب حقوقی شما ساخته شد
                        </h1>

                        <p style="margin:0 0 24px; font-size:15px; line-height:24px; color:#4b5563;">
                            حساب شما به عنوان نماینده شرکت در {{APP_NAME}} ایجاد شد. با رمز زیر وارد شوید.
                        </p>

                        <div style="text-align:center; margin:28px 0;">
                            <div style="display:inline-block; padding:16px 28px; background:#f3f4f6; border-radius:10px;
                                        font-size:26px; font-weight:bold; letter-spacing:3px; color:#111827;">
                                {{PASSWORD}}
                            </div>
                        </div>

                        <p style="margin:0 0 8px; font-size:14px; line-height:22px; color:#4b5563;">
                            پس از نخستین ورود، رمز خود را تغییر دهید.
                        </p>

                        <p style="margin:0; font-size:13px; line-height:22px; color:#9ca3af;">
                            این رمز را با هیچ‌کس به اشتراک نگذارید.
                        </p>

                    </td>
                </tr>

            </table>

        </td>
    </tr>
</table>
</body>
</html>
